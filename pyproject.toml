[project]
name = "hiretrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shinu Cherian", email = "shinucherian90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.62",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-prometheus>=2.5.0",
    "django-ratelimit>=4.1.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.17.1",
    "duckduckgo-search>=8.1.1",
    "g4f>=7.9.4",
    "groq>=1.6.0",
    "gunicorn>=26.0.0",
    "kafka-python-ng>=2.2.3",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-django>=0.65b0",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "resend>=2.35.0",
    "whitenoise>=6.12.0",
    "xhtml2pdf>=0.2.17",
]

[project.scripts]
hiretrack = "hiretrack:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
